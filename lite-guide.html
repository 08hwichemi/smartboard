<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 스마트보드 사용 설명서</title>
<link rel="icon" type="image/png" href="favicon.png">
<!-- 선생님들께 보내는 안내 페이지. 구성·엔진은 AutoFolder 설명서(08hwichemi/file-organizer-releases gh-pages)와 같고, 색은 스마트보드 남색.
     장면 내용은 아래 스크립트의 S 배열만 고치면 된다. 그림은 guide/lite/*.webp(만드는 법: docs/이어서-작업하기.md 10/18 17차). -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 한 화면에 한 장면. 위: 차례(장), 가운데: 글+화면이 한 카드, 아래: 이전/진행/다음.
     색·글꼴은 AutoFolder 프로그램과 같게. 장면 내용은 아래 스크립트의 S 배열만 고치면 된다. */
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --surface-sub: #F7F8FA;
    --fg: #17191C;
    --sub: #5F6670;
    --line: #E4E6EA;
    --accent: #1F3A5F;
    --accent-hover: #16304F;
    --accent-soft: #E8EEF6;
    --folder: #E3B23C;
    --folder-light: #F5CB5C;
    --ok: #1B6E43;
    --hl: #E8590C;
    --hl-soft: #FDEBDD;
    --ex: #8A5A00;
    --ex-soft: #FFF3D6;
    --shot-shadow: 0 10px 28px rgba(23, 25, 28, 0.13);
    --font: Pretendard, "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --surface: #1B1E24; --surface-sub: #22262D; --fg: #EDEFF2; --sub: #A3AAB4;
      --line: #2E333B; --accent: #8FB0E6; --accent-hover: #A9C3F0; --accent-soft: #24344D;
      --ok: #6CC596; --hl: #FF8A4C; --hl-soft: #3A2516; --ex: #F2C46B; --ex-soft: #3A2F16;
      --shot-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --surface: #1B1E24; --surface-sub: #22262D; --fg: #EDEFF2; --sub: #A3AAB4;
    --line: #2E333B; --accent: #8FB0E6; --accent-hover: #A9C3F0; --accent-soft: #24344D;
    --ok: #6CC596; --hl: #FF8A4C; --hl-soft: #3A2516; --ex: #F2C46B; --ex-soft: #3A2F16;
    --shot-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 1320px;
    margin: 0 auto;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    gap: 12px;
  }
  .nw { white-space: nowrap !important; }

  /* 위: 이름 + 차례 */
  .top { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 17px; white-space: nowrap; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .brand small { font-weight: 500; color: var(--sub); font-size: 14px; }
  .toc {
    display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto;
    margin-left: auto; padding: 4px; min-width: 0;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    scrollbar-width: none;
  }
  .toc::-webkit-scrollbar { display: none; }
  .toc button {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 36px; padding: 0 11px; flex-shrink: 0;
    border: 0; border-radius: 9px; background: transparent;
    color: var(--sub); font: inherit; font-size: 14px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .toc button:hover { background: var(--surface-sub); color: var(--fg); }
  .toc button[aria-current="step"] { background: var(--accent-soft); color: var(--accent); }
  .toc .star { color: var(--folder); font-size: 11px; }

  /* 가운데: 한 장면 */
  .stage { flex: 1; min-height: 0; display: flex; }
  .scene {
    flex: 1; min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: minmax(300px, 0.8fr) minmax(0, 1.45fr);
    gap: clamp(20px, 3vw, 48px);
    align-items: center;
    padding: clamp(20px, 3vw, 44px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: auto;
    animation: in 0.22s ease-out;
  }
  .scene:focus { outline: none; }
  @keyframes in { from { opacity: 0.4; transform: translateX(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .scene { animation: none; } }

  .text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .chip {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  .chip span { font-weight: 600; opacity: 0.8; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  h1 { font-size: clamp(30px, 3.6vw, 44px); line-height: 1.25; font-weight: 800; }
  h2 { font-size: clamp(24px, 2.5vw, 31px); line-height: 1.3; font-weight: 800; }
  .text p { margin: 0; font-size: 17px; color: var(--sub); text-wrap: pretty; }
  .text p b { color: var(--fg); font-weight: 700; }
  b.mark { color: var(--fg); font-weight: 750; box-shadow: inset 0 -0.42em 0 var(--hl-soft); }
  .btnlike {
    display: inline-block; padding: 0 8px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; line-height: 1.65;
  }
  .key {
    display: inline-block; min-width: 1.6em; padding: 0 7px; text-align: center;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px;
    background: var(--surface-sub); color: var(--fg); font-size: 14px; font-weight: 650; line-height: 1.6;
  }
  .copy {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-sub);
  }
  .copy code {
    flex: 1; min-width: 0; font-family: var(--font); font-size: 15px; font-weight: 650; color: var(--fg);
    word-break: break-all; line-height: 1.45;
  }
  .copy button {
    flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 0;
    background: var(--accent); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .copy button:hover { background: var(--accent-hover); }
  .tip {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border-radius: 12px; background: var(--surface-sub);
  }
  .tip svg { flex-shrink: 0; margin-top: 4px; color: var(--ok); }
  .tip > span { color: var(--sub); font-size: 15px; text-wrap: pretty; }
  .legend { display: inline-flex; align-items: center; gap: 8px; color: var(--sub); font-size: 13.5px; }
  .legend i { width: 18px; height: 12px; border: 2.5px solid var(--hl); border-radius: 4px; flex-shrink: 0; }

  /* 화면 그림 */
  .fig { margin: 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fig img {
    display: block; max-width: 100%; height: auto;
    max-height: calc(100dvh - 220px);
    object-fit: contain;
    border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shot-shadow); background: #fff;
  }
  .extag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; background: var(--ex-soft); color: var(--ex);
    font-size: 13px; font-weight: 650; white-space: nowrap;
  }

  /* 시작 세 장: 무엇인지 · 어디에 뜨는지 · 이렇게 써요 */
  .cover { display: flex; flex-direction: column; gap: 20px; align-items: stretch; align-content: start; }
  .cv-top { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .cv-top h1 { font-size: clamp(32px, 3.4vw, 48px); line-height: 1.2; }
  .cv-top h2 { margin: 0; font-size: clamp(28px, 2.8vw, 38px); line-height: 1.25; }
  .cv-lead { margin: 0; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.6; max-width: 40em; text-wrap: pretty; }
  .cv-lead b { color: var(--accent); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 16px; font-weight: 700; }
  .facts span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .facts svg { color: var(--ok); }
  /* 정리 전 → 정리 후 */
  .cv-ba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; }
  .cv-box { border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px 16px; background: var(--surface-sub); }
  .cv-box h3 { margin: 0 0 10px; font-size: 16px; color: var(--sub); }
  .cv-box.after { background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent-soft); }
  .cv-box.after h3 { color: var(--accent); }
  .cv-mess { display: flex; flex-wrap: wrap; gap: 7px; }
  .cv-file { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px 5px 5px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .cv-file i { font-style: normal; font-size: 9px; font-weight: 800; width: 30px; height: 22px; border-radius: 5px; display: grid; place-items: center; }
  .cv-arrow { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--accent); font-weight: 800; font-size: 14px; }
  .cv-folders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cv-folder { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; font-weight: 700; }
  .cv-folder small { font-weight: 500; color: var(--sub); font-size: 12.5px; }
  /* 어디에 뜨는지 */
  .cv-desk { margin: 0; align-self: center; max-width: min(100%, calc((100dvh - 390px) * 16 / 9)); }
  .cv-desk img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shot-shadow); }
  /* 이렇게 써요 */
  .cv-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .cv-step { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface); }
  .cv-step img { width: 100%; height: clamp(140px, 26vh, 260px); object-fit: cover; object-position: top left; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .cv-step h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 19px; }
  .cv-step h3 b { flex-shrink: 0; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 16px; }
  .cv-step p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--sub); text-wrap: pretty; }
  .cv-step p strong { color: var(--fg); }
  @media (max-height: 700px) and (min-width: 861px) {
    .cover { gap: 14px; }
    .cv-mess { gap: 5px; }
    .cv-file { padding-block: 3px; }
  }
  @media (max-width: 860px) {
    .cv-ba, .cv-steps { grid-template-columns: minmax(0, 1fr); }
    .cv-arrow svg { transform: rotate(90deg); }
    .cv-desk { max-width: 100%; }
  }

  /* 자주 묻는 것 */
  .faq { grid-template-columns: 1fr; align-content: start; align-items: start; }
  .qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .qa div { padding: 14px 16px; border-radius: 14px; background: var(--surface-sub); }
  .qa h3 { margin: 0 0 4px; font-size: 16px; }
  .qa p { margin: 0; color: var(--sub); font-size: 14.5px; line-height: 1.55; text-wrap: pretty; }
  .terms { margin: 0; color: var(--sub); font-size: 13.5px; }
  .faq { gap: 16px; }
  @media (max-height: 800px) and (min-width: 861px) {
    .faq { padding-block: 20px; }
    .qa { gap: 10px; }
    .qa div { padding: 11px 14px; }
    .qa p { font-size: 14px; line-height: 1.5; }
  }

  /* 아래: 이전 / 진행 / 다음 */
  .nav { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .nav button.go {
    min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .nav button.go:hover:not(:disabled) { background: var(--surface-sub); }
  .nav button.go.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav button.go.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .nav button.go:disabled { opacity: 0.35; cursor: default; }
  .bar { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .bar span { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 8px; }
  .bar span i { display: block; height: 100%; background: var(--accent); transition: width 0.2s; }
  .count { color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 1000px) {
    .brand small { display: none; }
  }
  @media (max-width: 860px) {
    .top { flex-direction: column; align-items: stretch; gap: 8px; }
    .toc { margin-left: 0; }
    .scene { grid-template-columns: minmax(0, 1fr); align-items: start; align-content: start; }
    .fig img { max-height: none; }
    .qa { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .nav { gap: 10px; }
    .nav button.go { padding: 0 12px; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6.5h4V20h3.5a1 1 0 0 0 1-1v-9"/></svg></span>
      내 스마트보드 <small>사용 설명서</small>
    </div>
    <nav class="toc" aria-label="차례" id="toc"></nav>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="nav">
    <button type="button" class="go" id="prev">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>이전
    </button>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <span class="count" id="count" aria-live="polite"></span>
    <button type="button" class="go primary" id="next"></button>
  </footer>
</div>

<script>
(() => {
  // 장(차례). star = 주요 기능
  const CH = [
    { key: "start", name: "시작" },
    { key: "install", name: "설치하기" },
    { key: "setup", name: "처음 설정" },
    { key: "auto", name: "켤 때 자동 실행" },
    { key: "dual", name: "두 모니터", star: true },
    { key: "home", name: "홈 화면", star: true },
    { key: "class", name: "우리 반", star: true },
    { key: "work", name: "수업·업무" },
    { key: "backup", name: "백업" },
    { key: "faq", name: "자주 묻는 것" },
  ];
  const URL_APP = "08hwichemi.github.io/smartboard/lite.html";

  // 장면. 글 표시법: [[단추]]  {{키}}  ==강조==  (뒤에 붙은 조사·마침표는 같은 줄에 붙어 다닌다)
  // ex: true = 크롬·윈도우 화면을 흉내 낸 예시 그림(실제와 조금 다를 수 있음). hl: true = 그림에 주황 테두리 있음.
  const S = [
    { id: "start", ch: "start", cover: "what" },
    { id: "start-where", ch: "start", cover: "where", img: "dual.webp" },
    { id: "start-how", ch: "start", cover: "how" },

    { id: "install-1", ch: "install", ex: true, hl: true, img: "addr.webp",
      alt: "크롬 새 탭의 주소 칸에 내 스마트보드 주소를 넣은 모습",
      title: "크롬을 열고 <span class=\"nw\">주소 칸에</span> 주소 넣기",
      body: [
        "크롬(또는 엣지)을 열고 맨 위 ==주소 칸==을 누르세요. 아래 [[복사]]를 누른 뒤 주소 칸에 {{Ctrl}}+{{V}}로 붙여 넣고 {{Enter}}.",
        "인터넷 창은 꼭 ==크롬이나 엣지==로 여세요. 백업 폴더 자동 저장이 이 둘에서만 돼요.",
      ],
      copy: URL_APP,
      tip: "메신저나 메일로 받은 링크가 있으면 그 링크를 눌러도 같은 화면이 열려요." },

    { id: "install-2", ch: "install", ex: true, hl: true, img: "install.webp",
      alt: "주소 칸 오른쪽 끝의 설치 아이콘을 누르면 뜨는 앱 설치 창에서 설치를 누르는 모습",
      title: "주소 칸 오른쪽 <span class=\"nw\">설치 아이콘</span> → [설치]",
      body: [
        "화면이 열리면 주소 칸 ==맨 오른쪽==에 모니터 모양 ==설치 아이콘==이 생겨요. 누르고 [[설치]].",
        "그러면 주소창 없는 ==앱 창==으로 다시 열리고, 바탕화면과 시작 메뉴에 ==내 스마트보드== 아이콘이 생겨요.",
      ],
      tip: "아이콘이 안 보이면 오른쪽 위 ⋮ 메뉴 → ‘전송, 저장 및 공유’ → ‘앱 설치…’. 엣지는 ⋯ 메뉴 → ‘앱’ → ‘이 사이트를 앱으로 설치’." },

    { id: "install-3", ch: "install", img: "home.webp",
      alt: "앱 창으로 열린 내 스마트보드 홈 화면",
      title: "앱 창으로 열리면 설치 끝",
      body: [
        "이제부터는 바탕화면의 ==내 스마트보드== 아이콘을 두 번 누르면 바로 떠요. 크롬을 따로 열 필요가 없어요.",
        "처음 열면 ==처음 설정== 창이 떠요. 다음 장부터 이어서 볼게요.",
      ],

      body: [
        "백업 폴더를 정해 두면 자료가 바뀔 때마다 몇 분 안에 ==내 스마트보드_백업.json== 한 파일에 덮어써 저장돼요. 파일이 쌓이지 않아요.",
        "일주일에 한 번 ==…_백업_지난주.json==도 남겨요. 실수로 지운 게 있으면 이 파일로 돌아갈 수 있어요.",
      ],
      tip: "크롬을 다시 켠 뒤 첫 저장 때 ‘폴더 쓰기를 허용해 주세요’ 띠가 뜨면 한 번 눌러 주세요. ‘항상 허용’을 고르면 다음부턴 안 물어요." },

    { id: "backup-2", ch: "backup", hl: true, img: "backup-restore.webp",
      alt: "백업 창. 📤 백업 파일로 복원하기 버튼에 주황 테두리",
      title: "다른 컴퓨터로 옮길 때",
      body: [
        "백업 폴더의 ==내 스마트보드_백업.json==을 USB 등으로 옮긴 뒤, 새 컴퓨터의 보드에서 오른쪽 위 [[💾 백업]] → [[📤 백업 파일로 복원하기]].",
        "복원하면 그 컴퓨터의 자료가 ==파일 내용으로 바뀌어요==. 명렬표·설정·시간표·수행평가까지 전부 들어 있어요.",
      ],
      tip: "백업 파일엔 학생 이름·전화·결석 사유가 들어 있어요. 공용 PC·메신저에 두지 마세요." },

    { id: "faq", ch: "faq", faq: true },
  ];

  const FAQ = [
    ["집 컴퓨터에서도 볼 수 있나요?", "서버가 없어서 저절로 맞춰지진 않아요. 백업 파일을 USB로 가져가 집 컴퓨터에서 복원하면 돼요. 한 컴퓨터를 주로 쓰시길 권해요."],
    ["결석계 양식이 우리 학교 것과 달라요", "학교 이름은 설정한 학교로 들어가지만 칸 구성은 한 학교 양식 기준이에요. 제출용은 학교 양식을 쓰고, 여기선 기록 관리·초안용으로."],
    ["급식·학사일정이 안 나와요", "⚙️ 설정에서 학교를 골랐는지 보세요. 골랐는데도 비어 있으면 학교가 나이스에 그날 급식·일정을 올리지 않은 거예요."],
    ["자료가 사라졌어요", "크롬의 ‘인터넷 사용 기록 삭제’에서 사이트 데이터를 지웠을 때 그래요. 💾 백업 → [폴더에서 복원]으로 돌려놓으세요. 보드가 백업보다 자료가 훨씬 적으면 스스로 복원할지 물어봐요."],
    ["‘새 버전이 있습니다’ 띠가 떠요", "보드가 고쳐질 때마다 떠요. 눌러서 새로 고치면 돼요. 자료는 그대로예요."],
    ["휴대폰에서도 되나요?", "열리긴 하고 시간표·캘린더·급식·할 일을 볼 수 있지만 자료는 컴퓨터와 따로예요. 컴퓨터용으로 생각해 주세요."],
    ["내 자료가 밖으로 나가나요?", "아니요. 크롬 안(이 컴퓨터)과 백업 폴더에만 있어요. 만든 사람도 못 봐요. 급식·학사일정·날씨·뉴스만 공개 자료를 읽어 와요."],
    ["더 자세한 사용법은요?", "보드 오른쪽 위 ❓ 설명서와 각 화면의 📖 설명서 버튼이 단계별로 알려 줘요."],
    ["다른 선생님께 주려면요?", "이 설명서 주소 <span class=\"nw\">08hwichemi.github.io/</span><span class=\"nw\">smartboard/lite-guide.html</span>을 보내 주세요."],
  ];

  function fmt(s) {
    return s
      .replace(/\[\[(.+?)\]\]([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw"><span class="btnlike">${a}</span>${b}</span>`)
      .replace(/\{\{(.+?)\}\}([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw"><span class="key">${a}</span>${b}</span>`)
      .replace(/\[([^\[\]<>]+?)\]([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw">[${a}]${b}</span>`)
      .replace(/‘([^’<]{1,16})’([가-힣]{0,3}[.,]?)/g, (m, a, b) => `<span class="nw">‘${a}’${b}</span>`)
      .replace(/==(.+?)==([가-힣]{0,3}[.,]?)/g, (m, a, b) =>
        a.length <= 12 ? `<span class="nw"><b class="mark">${a}</b>${b}</span>` : `<b class="mark">${a}</b>${b}`);
  }
  const TIP_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v4M8 4.6v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';


  const chScenes = (key) => S.filter((x) => x.ch === key);
  const chName = (key) => CH.find((c) => c.key === key).name;
  const RIGHT = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>';
  const PILL = (t) => `<span class="cv-file">${t}</span>`;

  // 시작 세 장: what = 무엇인지, where = 어디에 두고 쓰는지, how = 이렇게 써요(세 단계)
  function coverHTML(kind) {
    if (kind === "where") {
      return `
      <div class="cv-top"><span class="chip">어디에 두고 쓰나요</span><h2>보조 모니터에 종일 띄워 두세요</h2>
        <p class="cv-lead">한쪽에서 나이스·한글 작업을 하는 동안, 다른 한쪽에는 <b>시계·시간표·할 일·급식</b>이 늘 보여요. 창을 옮기는 법은 ‘두 모니터’ 장에.</p></div>
      <figure class="cv-desk"><img src="guide/lite/dual.webp" alt="주 모니터에는 한글 문서, 보조 모니터에는 내 스마트보드가 늘 떠 있는 그림(주황 테두리)"></figure>`;
    }
    if (kind === "how") {
      return `
      <div class="cv-top"><span class="chip">한눈에 보기</span><h2>이렇게 써요</h2>
        <p class="cv-lead">처음 한 번만 세 가지를 하면, 그 뒤로는 켜 두기만 하면 돼요.</p></div>
      <div class="cv-steps">
        <div class="cv-step"><img src="guide/lite/install.webp" alt=""><h3><b>1</b>크롬에서 열고 앱으로 설치</h3><p>주소를 넣고 <strong>설치 아이콘</strong> 한 번. 바탕화면에 아이콘이 생겨요.</p></div>
        <div class="cv-step"><img src="guide/lite/settings.webp" alt=""><h3><b>2</b>처음 설정: 백업 폴더·이름·학교</h3><p><strong>백업 폴더</strong>를 먼저 정하고 이름·학교·일과 시간을 적어요.</p></div>
        <div class="cv-step"><img src="guide/lite/roster.webp" alt=""><h3><b>3</b>명렬표 넣고 늘 켜 두기</h3><p>명렬표 한 번이면 <strong>좌석·결석·조퇴·수행평가·생기부</strong>가 다 이어져요.</p></div>
      </div>`;
    }
    const home = ["🕒 지금 몇 교시", "⭐ 내 시간표", "📅 캘린더", "🍱 급식", "🌤️ 날씨", "📰 뉴스", "✅ 할 일", "🔗 즐겨찾기"].map(PILL).join("");
    const cls = ["🪑 좌석배치표", "📋 결석계", "🎫 조퇴증", "📊 수행평가", "📝 생기부", "📄 양식"].map(PILL).join("");
    return `
      <div class="cv-top">
        <span class="chip">선생님 한 분을 위한 교무 보드</span>
        <h1>내 자리에 늘 켜 두는 보드.</h1>
        <p class="cv-lead"><b>내 스마트보드</b>는 시계·시간표·캘린더·급식·할 일을 한 화면에 두고, <b>명렬표 하나로 좌석배치표·결석계·조퇴증·수행평가·생기부까지 이어 쓰는</b> <span class="nw">크롬 앱</span>이에요.</p>
      </div>
      <div class="cv-ba">
        <div class="cv-box"><h3>홈 한 화면에</h3><div class="cv-mess">${home}</div></div>
        <div class="cv-arrow">${RIGHT}명렬표 하나로</div>
        <div class="cv-box after"><h3>우리 반·수업 일까지</h3><div class="cv-mess">${cls}</div></div>
      </div>
      <div class="facts"><span>${CHECK}설치 5분</span><span>${CHECK}서버·로그인 없음, 무료</span><span>${CHECK}자료는 내 컴퓨터에만</span></div>`;
  }

  function faqHTML() {
    return `
      <div class="text"><span class="chip">자주 묻는 것</span><h2>걱정되는 것, 궁금한 것</h2></div>
      <div class="qa">${FAQ.map(([q, a]) => `<div><h3>${q}</h3><p>${fmt(a)}</p></div>`).join("")}</div>
      <p class="terms">교육·개인·업무 용도로 무료로 쓸 수 있어요<span class="nw">(판매는 할 수 없어요)</span>. <span class="nw">만든 사람 이용휘(화학 교사)</span> · <span class="nw">© 2026 이용휘</span></p>`;
  }

  function sceneHTML(sc) {
    if (sc.cover) return coverHTML(sc.cover);
    if (sc.faq) return faqHTML();
    const list = chScenes(sc.ch);
    const k = list.indexOf(sc) + 1;
    const star = CH.find((c) => c.key === sc.ch).star ? '<span aria-hidden="true">★</span> ' : "";
    return `
      <div class="text">
        <span class="chip">${star}${chName(sc.ch)}<span>${k} / ${list.length}</span></span>
        <h2>${fmt(sc.title)}</h2>
        ${sc.body.map((p) => `<p>${fmt(p)}</p>`).join("")}
        ${sc.copy ? `<div class="copy"><code>${sc.copy}</code><button type="button" data-copy="${sc.copy}">복사</button></div>` : ""}
        ${sc.tip ? `<div class="tip">${TIP_ICON}<span>${fmt(sc.tip)}</span></div>` : ""}
        ${sc.hl ? `<span class="legend"><i></i>주황 테두리가 누를 곳이에요</span>` : ""}
      </div>
      <figure class="fig">
        <img src="guide/lite/${sc.img}" alt="${sc.alt}">
        ${sc.ex ? `<figcaption class="extag">예시 그림 · 실제 화면과 조금 다를 수 있어요</figcaption>` : ""}
      </figure>`;
  }

  const stage = document.getElementById("stage");
  const toc = document.getElementById("toc");
  const bar = document.getElementById("bar");
  const count = document.getElementById("count");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let cur = 0;

  CH.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.ch = c.key;
    b.innerHTML = (c.star ? '<span class="star" aria-hidden="true">★</span>' : "") + c.name;
    b.addEventListener("click", () => show(S.findIndex((x) => x.ch === c.key)));
    toc.appendChild(b);
    const seg = document.createElement("span");
    seg.dataset.ch = c.key;
    seg.style.flex = String(chScenes(c.key).length);
    seg.innerHTML = "<i></i>";
    bar.appendChild(seg);
  });

  function show(i, fromHash) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    const sc = S[cur];
    const sec = document.createElement("section");
    sec.className = "scene" + (sc.cover ? " cover" : "") + (sc.faq ? " faq" : "");
    sec.id = sc.id;
    sec.tabIndex = -1;
    sec.setAttribute("aria-label", sc.title ? sc.title.replace(/\[\[|\]\]|\{\{|\}\}|==/g, "") : chName(sc.ch));
    sec.innerHTML = sceneHTML(sc);
    stage.replaceChildren(sec);

    const ci = CH.findIndex((c) => c.key === sc.ch);
    [...toc.children].forEach((b, k) => (k === ci ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current")));
    toc.children[ci].scrollIntoView({ block: "nearest", inline: "nearest" });
    [...bar.children].forEach((seg, k) => {
      const list = chScenes(CH[k].key);
      const done = k < ci ? list.length : k === ci ? list.indexOf(sc) + 1 : 0;
      seg.firstChild.style.width = (done / list.length) * 100 + "%";
    });
    count.textContent = `${cur + 1} / ${S.length}`;
    prev.disabled = cur === 0;
    next.disabled = cur === S.length - 1;
    next.innerHTML = (sc.id === "start-how" ? "설치부터 보기" : "다음") + ARROW;
    if (!fromHash) {
      try { history.replaceState(null, "", "#" + sc.id); } catch (e) {}
    }
    warmNear();
  }

  // 주소 복사
  stage.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const text = "https://" + btn.dataset.copy;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (err) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (err) {}
      ta.remove();
    }
    if (!ok) {
      const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    btn.textContent = ok ? "복사했어요" : "Ctrl+C로 복사";
    setTimeout(() => (btn.textContent = "복사"), 1800);
  });

  prev.addEventListener("click", () => show(cur - 1));
  next.addEventListener("click", () => show(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  });

  // 휴대폰: 옆으로 밀어 넘기기
  let sx = null, sy = 0;
  stage.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1));
    sx = null;
  });

  // 그림 미리 받기: 넘길 때 기다리지 않게 다음 장들을 먼저 받아 두고, 첫 화면이 뜬 뒤 나머지도 차례로 받는다.
  const warmed = new Set();
  const warm = (name) => {
    if (!name || warmed.has(name)) return Promise.resolve();
    warmed.add(name);
    const im = new Image();
    im.src = "guide/lite/" + name;
    return im.decode().catch(() => {});
  };
  const warmNear = () => [1, 2, 3, -1].forEach((d) => warm(S[cur + d]?.img));
  window.addEventListener("load", async () => {
    for (const sc of S) await warm(sc.img);
  });

  const fromHash = () => S.findIndex((x) => "#" + x.id === location.hash);
  const start = fromHash();
  show(start >= 0 ? start : 0, true);
  window.addEventListener("hashchange", () => { const k = fromHash(); if (k >= 0) show(k, true); });
})();
</script>
