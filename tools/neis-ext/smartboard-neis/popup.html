<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>body{font:13px/1.55 "Malgun Gothic",sans-serif;width:330px;margin:12px}h1{font-size:14px;margin:0 0 8px}button{width:100%;margin-top:6px;padding:7px;font:inherit;cursor:pointer}.box{background:#f3f4f6;border-radius:8px;padding:8px;white-space:pre-line;margin-bottom:6px}.m{font-size:11.5px;color:#666}.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row input[type=time]{font:inherit}</style>
</head><body><h1>🔁 스마트보드 나이스 변경수업</h1>
<div class="row"><label><input type="checkbox" id="on"> 평일 자동 조회</label> <input type="time" id="time"> <span class="m">놓치면 나이스 로그인할 때</span></div>
<div class="box" id="auto">불러오는 중…</div>
<div class="box" id="s"></div>
<button id="stop" style="display:none">■ 멈추기</button>
<button id="now">▶ 지금 자동 조회 해 보기 (나이스 로그인 상태에서)</button>
<button id="log">📋 마지막 자동 조회 기록 저장 (문제가 있을 때 보내 주세요)</button>
<button id="reports">📄 마지막 조회 보고서 저장 (안 들어간 칸을 살펴볼 때 보내 주세요)</button>
<button id="resend">📤 스마트보드로 다시 보내기</button>
<button id="open">🏫 스마트보드 열기</button>
<button id="reset" style="font-size:11.5px;color:#666">🧪 시험용: 오늘 자동 조회 기록 지우기(처음 켠 것처럼)</button>
<p class="m">자동 조회 = 나이스 → 교과담임 → 시간표관리 → 전체시간표조회 → 변경수업조회, 일자 이번 주 월~금, 1·2·3학년(3시간 지나 다시 로그인하면 한 번 더). 같은 크롬에 스마트보드가 열려 있으면 바로 넣고, 없으면 열 때 넣어요.</p>
<script src="popup.js"></script></body></html>
